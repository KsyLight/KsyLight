<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090320"/>
      <stop offset="0.45" stop-color="#2a0b4d"/>
      <stop offset="0.78" stop-color="#7a1f6e"/>
      <stop offset="1" stop-color="#ff7aa8"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#ffd1e3"/>
      <stop offset="1" stop-color="#ffd447"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .star{animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    .petal{animation:fall 11s linear infinite}
    @keyframes fall{
      0%{transform:translate(0,-30px) rotate(0deg);opacity:0}
      8%{opacity:1}
      100%{transform:translate(-220px,400px) rotate(540deg);opacity:.9}
    }
    .shoot{stroke-dasharray:160 1400;animation:sh 7s ease-in infinite}
    @keyframes sh{0%{stroke-dashoffset:160;opacity:0}6%{opacity:1}22%{stroke-dashoffset:-700;opacity:0}100%{stroke-dashoffset:-700;opacity:0}}
    .title{animation:pulse 4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.92}50%{opacity:1}}
    .moon{animation:breathe 6s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle class="star" cx="80" cy="40" r="1.6"/>
      <circle class="star" cx="210" cy="95" r="1.2" style="animation-delay:.6s"/>
      <circle class="star" cx="330" cy="30" r="1.8" style="animation-delay:1.2s"/>
      <circle class="star" cx="420" cy="120" r="1.1" style="animation-delay:2s"/>
      <circle class="star" cx="520" cy="55" r="1.4" style="animation-delay:.3s"/>
      <circle class="star" cx="640" cy="25" r="1.2" style="animation-delay:1.7s"/>
      <circle class="star" cx="720" cy="90" r="1.7" style="animation-delay:.9s"/>
      <circle class="star" cx="800" cy="40" r="1.1" style="animation-delay:2.4s"/>
      <circle class="star" cx="870" cy="140" r="1.3" style="animation-delay:1.4s"/>
      <circle class="star" cx="1110" cy="35" r="1.6" style="animation-delay:.5s"/>
      <circle class="star" cx="1160" cy="120" r="1.2" style="animation-delay:2.1s"/>
      <circle class="star" cx="150" cy="150" r="1.1" style="animation-delay:1s"/>
      <circle class="star" cx="580" cy="135" r="1" style="animation-delay:2.7s"/>
      <circle class="star" cx="1050" cy="170" r="1" style="animation-delay:.2s"/>
    </g>

    <!-- shooting star -->
    <path class="shoot" d="M 860 20 L 420 170" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- moon -->
    <circle cx="990" cy="95" r="120" fill="url(#moonGlow)" class="moon"/>
    <circle cx="990" cy="95" r="52" fill="#fff1d8"/>
    <circle cx="972" cy="82" r="9" fill="#f3dcbc" opacity=".7"/>
    <circle cx="1008" cy="112" r="6" fill="#f3dcbc" opacity=".6"/>
    <circle cx="1012" cy="78" r="4" fill="#f3dcbc" opacity=".6"/>

    <!-- mountains -->
    <path d="M0 270 L140 215 L260 250 L420 190 L520 230 L640 175 L760 228 L900 200 L1040 240 L1200 205 L1200 340 L0 340Z" fill="#4a1a66" opacity=".75"/>
    <path d="M0 300 L120 262 L250 290 L380 255 L520 292 L660 262 L800 296 L960 266 L1100 292 L1200 272 L1200 340 L0 340Z" fill="#2a0c40"/>
    <path d="M0 340 L0 318 Q300 300 600 316 T1200 310 L1200 340Z" fill="#14041f"/>

    <!-- torii gate -->
    <g fill="#14041f">
      <path d="M1032 226 Q1090 214 1148 226 L1150 236 Q1090 226 1030 236Z"/>
      <rect x="1040" y="240" width="100" height="7"/>
      <rect x="1052" y="232" width="9" height="90"/>
      <rect x="1119" y="232" width="9" height="90"/>
      <rect x="1086" y="238" width="8" height="10"/>
    </g>

    <!-- sakura branch -->
    <g>
      <path d="M-10 18 Q60 40 120 34 Q170 30 215 58" stroke="#1b0826" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M70 38 Q95 70 88 104" stroke="#1b0826" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M150 36 Q180 10 230 12" stroke="#1b0826" stroke-width="4" fill="none" stroke-linecap="round"/>
      <g fill="#ffb7d0">
        <circle cx="40" cy="30" r="9"/><circle cx="58" cy="44" r="8"/><circle cx="88" cy="104" r="8"/>
        <circle cx="80" cy="82" r="7"/><circle cx="120" cy="30" r="9"/><circle cx="136" cy="44" r="7"/>
        <circle cx="175" cy="22" r="8"/><circle cx="200" cy="10" r="7"/><circle cx="230" cy="12" r="9"/>
        <circle cx="212" cy="58" r="9"/><circle cx="195" cy="48" r="6"/><circle cx="100" cy="62" r="6"/>
      </g>
      <g fill="#ff8fb5">
        <circle cx="40" cy="30" r="3"/><circle cx="120" cy="30" r="3"/><circle cx="230" cy="12" r="3"/>
        <circle cx="212" cy="58" r="3"/><circle cx="88" cy="104" r="3"/><circle cx="175" cy="22" r="3"/>
      </g>
    </g>

    <!-- falling petals -->
    <g fill="#ffc6da">
      <g transform="translate(120,0)"><path class="petal" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(260,0)"><path class="petal" style="animation-delay:-2s;animation-duration:13s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(400,0)"><path class="petal" style="animation-delay:-5s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(560,0)"><path class="petal" style="animation-delay:-8s;animation-duration:12s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(700,0)"><path class="petal" style="animation-delay:-3.5s;animation-duration:14s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(840,0)"><path class="petal" style="animation-delay:-6.5s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(980,0)"><path class="petal" style="animation-delay:-1s;animation-duration:12.5s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(1120,0)"><path class="petal" style="animation-delay:-9.5s;animation-duration:13.5s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(330,0)"><path class="petal" style="animation-delay:-10s;animation-duration:15s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
      <g transform="translate(770,0)"><path class="petal" style="animation-delay:-4.2s;animation-duration:10s" d="M0 0 C4 -6 12 -6 10 2 C8 8 2 8 0 0Z"/></g>
    </g>

    <!-- text -->
    <g text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif">
      <g fill="#ffd1e3" opacity=".9"><circle cx="570" cy="88" r="2.5"/><circle cx="600" cy="88" r="4"/><circle cx="630" cy="88" r="2.5"/></g>
      <text class="title" x="600" y="160" font-size="66" font-weight="800" letter-spacing="4" fill="url(#title)" filter="url(#glow)">EGOR VASILENKO</text>
      <text x="600" y="198" font-size="22" letter-spacing="6" fill="#ffffff" opacity=".85">ЕГОР ВАСИЛЕНКО</text>
      <rect x="520" y="214" width="160" height="2" rx="1" fill="#ffd447" opacity=".8"/>
      <text x="600" y="246" font-size="17" letter-spacing="5" fill="#ffd447">DATA SCIENTIST · ML ENGINEER</text>
    </g>
  </g>
</svg>
